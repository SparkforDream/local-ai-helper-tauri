# ══════════════════════════════════════════════
# 拉黑规则 —— 命中即警告，不给链接
# ══════════════════════════════════════════════

blacklistPatterns:
  - pattern: ".*下载站.*"
    reason: 下载站几乎全部捆绑推广软件
  - pattern: ".*高速下载器.*"
    reason: 几十 KB 到几 MB 的高速下载器必带捆绑全家桶
  - pattern: ".*绿色版.*"
    reason: 绿色版来源不明，常带后门
  - pattern: ".*破解版.*"
    reason: 破解版是病毒主要投放渠道
  - pattern: ".*游戏管家.*"
    reason: 非官方，多为仿冒
  - pattern: ".*加速器.*"
    reason: 非官方，可能劫持流量
  - pattern: ".*全家桶.*"
    reason: 捆绑安装的代名词
  - pattern: ".*中文版.*官方.*"
    reason: 真正的官方不需要自称「中文版官方」
