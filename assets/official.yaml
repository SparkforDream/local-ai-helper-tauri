# 官网白名单 — 实测验证版
#
# 纪律：
#   1. 每一条都必须经过真实 HTTP 请求验证，不允许凭记忆写。
#   2. 记录 verifiedAt 与 HTTP 状态，过期即重新验证。
#   3. 明确标注 primary 主域名与 alt 备用域名，下载链接只用 primary。
#   4. 有仿冒风险的单独写 trap 字段，用来在回答里提醒用户。
#   5. 本文件是代码资产，模型无权修改。模型只能引用，不能生成新条目。

version: 2
verifiedAt: 2026-11-21
verifier: HTTP HEAD/GET 实测 + 证书主体校验

# ══════════════════════════════════════════════
# 解压软件 —— 小白第一步，最容易下到假站
# ══════════════════════════════════════════════
entries:

  - id: 7zip
    name: 7-Zip
    # 注意：不把「解压软件」「压缩软件」这类**通用类别词**放进别名。
    # 放进去会导致"解压软件是什么"被判成"找 7-Zip"，
    # 而用户其实在问这类软件是什么。类别词单独用 SOFT_CATEGORY 处理。
    aliases: [7z, 7-zip, 7zip, 七压, 七zip]
    primary: https://www.7-zip.org/
    download: https://www.7-zip.org/download.html
    domain: 7-zip.org
    alt: [https://www.7-zip.com/]     # 实测内容与 .org 完全一致，官方持有
    status: verified
    httpStatus: 200
    typoIsTrap: true
    note: 完全免费，无广告，无捆绑。装完右键就能解压。
    trap:
      - "搜索结果的「7-Zip 中文版」「7-zip.cn」「7zip.cn」都不是官方"
      - "官方只有 7-zip.org（及内容一致的 7-zip.com）"
      - "认准下载链接里的 github.com/ip7z/7zip 才是真源"

  - id: bandizip
    name: Bandizip
    aliases: [bandizip, 班迪]
    primary: https://cn.bandisoft.com/bandizip/
    download: https://cn.bandisoft.com/bandizip/download/
    # 校验用户给的地址时用的完整主机名。
    # 不能只写 bandisoft.com，因为那是公司主站，
    # Bandizip 的真实地址是 cn.bandisoft.com/bandizip/。
    domain: cn.bandisoft.com
    alt: [https://www.bandisoft.com/bandizip/]   # 国际站
    status: verified
    httpStatus: 200
    note: 界面比 7-Zip 友好，但安装时会有推荐组件，选「仅安装」。
    trap:
      - "「Bandizip 中文网」「bandizip.cn」不是官方"
      - "安装到最后一步注意取消勾选附带软件"

# ══════════════════════════════════════════════
# 游戏平台
# ══════════════════════════════════════════════

  - id: steam
    name: Steam
    aliases: [steam, staem, stema, 蒸汽, 蒸汽平台, steam官网]
    primary: https://store.steampowered.com/
    download: https://store.steampowered.com/about/
    domain: store.steampowered.com
    status: verified
    httpStatus: 200
    # 错拼本身是仿冒重灾区：搜 staem / stema 出来大量假站。
    # 置 true 后，拼错时会额外提醒一句"搜这个词出来的多半是仿的站"。
    typoIsTrap: true
    note: 客户端在「关于」页下载。商店页右上角也有安装按钮。
    trap:
      - "「Steam 游戏管家」「Steam 加速器」「steam中国」都不是官方"
      - "官方不会要求付费才能下载客户端"
      - "认准地址栏 store.steampowered.com，注意是 steampowered 不是 steam"

  - id: watt-toolkit
    name: Watt Toolkit（原 Steam++）
    aliases: [watt, watt toolkit, steam++, steampp, 蒸汽加速, 社区加速]
    primary: https://steampp.net/
    download: https://steampp.net/
    domain: steampp.net
    alt: 
      - https://github.com/BeyondDimension/SteamTools    # 开源仓库
      - https://apps.microsoft.com/detail/9mtcfhs560ng   # 微软商店
    status: verified
    httpStatus: 200
    note: 开源免费。主要用来加速 Steam 社区访问，不加速游戏下载。
    trap:
      - "这东西不能提升游戏帧数，只能解决商店/社区打不开"
      - "别在非官方站点下「Steam++ 绿色版」"

