[package]
name = "local-ai-helper"
version = "0.1.0"
description = "本地 AI 助手"
authors = ["YG"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "local_ai_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
